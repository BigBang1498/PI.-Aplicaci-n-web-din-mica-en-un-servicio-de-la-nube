<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros pdf gratuitos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tú Biblioteca Digital Gratuita</h1>
        <h2>Hola mundo desde Jenkins</h2>
        <h2>Aquí puedes consultar y subir tus libros pdfs</h2>
    </header>
    <main>
        <section class="botones">
            <button id="btn_agregar">Agregar libro</button>
        </section>
        <section class="mostrar">
            <a href="http://"></a>
        </section>
        <form id="formulario_agregar" class="formulario_agregar">
            <label>Nombre del autor: </label><br>
            <input type="text" name="autor" placeholder="Ingresa el autor"><br>
            <label>Nombre del pdf: </label><br>
            <input type="text" name="titulo" placeholder="Ingresa el titulo"><br>
            <label>Ingresa el link del pdf: </label><br>
            <input type="text" name="url" placeholder="Ingresa el link del pdf"><br>
            <button type="submit" class="submit">Agregar</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
